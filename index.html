<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Quilt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Control Bar -->
    <header class="control-bar">
        <h1 class="app-title">Wikipedia Quilt</h1>

```
    <div class="controls">
        <div class="color-control">
            <label class="color-label">
                <input type="checkbox" id="colorToggle" class="color-toggle">
                <span class="toggle-track">
                    <span class="toggle-thumb"></span>
                </span>
                <span class="toggle-label">Color filter</span>
            </label>
            <input type="color" id="colorPicker" value="#e63946" class="color-picker" disabled>
        </div>
        
        <button id="rerollBtn" class="reroll-btn">
            <svg class="dice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
                <circle cx="15.5" cy="8.5" r="1.5" fill="currentColor"/>
                <circle cx="8.5" cy="15.5" r="1.5" fill="currentColor"/>
                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            </svg>
            Re-roll quilt
        </button>
    </div>
</header>

<!-- Loading Indicator -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Stitching your quilt...</p>
        <p class="loading-progress" id="loadingProgress">0 / 0 tiles</p>
    </div>
</div>

<!-- Message Display -->
<div id="messageDisplay" class="message-display hidden">
    <p id="messageText"></p>
</div>

<!-- Quilt Grid -->
<main id="quiltGrid" class="quilt-grid"></main>

<script src="main.js"></script>
```

</body>
</html>
